<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Hexagon / Card -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0b1120" stroke="url(#grad)" stroke-width="2.5" />
  <!-- Cloud & Terminal Icon -->
  <path d="M22 36a8 8 0 0 1 15-4.2 6 6 0 0 1 7 5.2 6 6 0 0 1-5 6H22a6 6 0 0 1 0-12 8 8 0 0 1 0 5z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  <!-- Prompt Symbol >_ -->
  <path d="M24 28l6 5-6 5" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="34" y1="38" x2="42" y2="38" stroke="#6366f1" stroke-width="3" stroke-linecap="round" />
</svg>
